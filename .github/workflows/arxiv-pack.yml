name: 🤖 MatVerse Auto-Build & Evidence Registry

on:
  push:
    branches: [main]
    paths:
      - 'papers/**'
      - 'evidence/**'
      - '.github/workflows/**'
      - 'scripts/**'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: matverse-arxiv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-artifacts:
    name: build-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ Prepare scripts
        run: chmod +x scripts/build_arxiv_tarballs.sh

      - name: 📦 Build arXiv tarballs (antifragile mode)
        env:
          ALLOW_SOURCE_ONLY: "1"
        run: ./scripts/build_arxiv_tarballs.sh

      - name: 📤 Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
          if-no-files-found: error

  update-evidence:
    name: update-evidence
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: 🔐 Update evidence registry from dist
        run: |
          python3 << 'PY'
          import json
          import hashlib
          from datetime import datetime
          from pathlib import Path

          dist_dir = Path("dist")
          evidence_file = Path("evidence/index.json")

          with evidence_file.open('r', encoding='utf-8') as f:
              registry = json.load(f)

          artifacts = registry.get("artifacts", [])
          for artifact in artifacts:
              tarball_name = artifact["id"] + ".tar.gz"
              tarball_path = dist_dir / tarball_name
              if not tarball_path.exists():
                  continue

              h = hashlib.sha256()
              with tarball_path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)

              artifact["sha256"] = h.hexdigest()
              artifact["size_bytes"] = tarball_path.stat().st_size
              artifact["status"] = "ready-for-submission"
              artifact["timestamp"] = datetime.utcnow().isoformat() + "Z"

          registry["updated_at"] = datetime.utcnow().isoformat() + "Z"

          with evidence_file.open('w', encoding='utf-8') as f:
              json.dump(registry, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print("✅ evidence/index.json atualizado")
          PY

      - name: 📤 Upload evidence snapshot
        uses: actions/upload-artifact@v4
        with:
          name: evidence-snapshot
          path: evidence/index.json
          if-no-files-found: error

  validate-integrity:
    name: validate-integrity
    runs-on: ubuntu-latest
    needs: [build-artifacts, update-evidence]
    timeout-minutes: 10

    steps:
      - name: 📥 Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: ✅ Verify SHA256 checksums
        run: |
          set -euo pipefail
          cd dist
          if [ ! -f SHA256SUMS.txt ]; then
            sha256sum *.tar.gz > SHA256SUMS.txt
          fi
          sha256sum -c SHA256SUMS.txt

      - name: 📋 Build summary
        run: |
          echo "Artifacts in dist/:"
          find dist -maxdepth 1 -type f -print
