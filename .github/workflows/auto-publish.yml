name: Auto-Publish

on:
  repository_dispatch:
    types: [matverse_publish]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/trigger_publish.py "${{ github.event.client_payload.tx_id }}"
